# module_defs.conf - per-module behaviour definitions used by `main`.
#
# Add one section per module here instead of editing `main` whenever a new
# module is added. Modules with no section (or missing keys) default to
# split = no and nothing copied to files_to_keep.
#
# Supported keys:
#
#   split = yes|no
#       Whether this module can be used with the pipeline's "split" (block)
#       feature. If "no", the module always runs once on the full input, even
#       if the pipeline line requests a split.
#
#   keep = <glob>[ => <dest>]
#       A file (glob, relative to the module's own output directory) to copy
#       into files_to_keep. May be repeated. <dest>, if given, is appended to
#       the "<n>.<module>.<block>" destination name, e.g. "=> nodes" produces
#       "<n>.<module>.nodes.<block>". <dest> may use {raw_output} and {block}.
#
#   keep_extra = <path> => <dest>
#       Same as `keep`, but <path> is relative to
#       /data/<project>/intermediate_files instead of the module's output
#       directory. {block} in <path> refers to the "B<i>C<j>" block id.
#
#   keep_if_exists = <glob>[ => <dest>]
#       Like `keep`, but only copied if a matching file exists. When it does,
#       the `keep_else` entries below are skipped entirely for this module.
#
#   keep_else = <glob>[ => <dest>]
#       Only applied when `keep_if_exists` did not match anything.

[CDS_processing]
split = yes

[CGA]
split = yes

[add_taxonomy]
split = yes

